<!doctype html><meta charset="utf-8"><title>AgentTeams Mermaid verification</title>
<style>body{font:15px system-ui;margin:24px;background:#f8fafc;color:#18212f}section{background:white;border:1px solid #ddd;margin:12px 0;padding:12px}svg{max-width:900px}pre{white-space:pre-wrap}.fail{color:#ab1730}</style>
<h1>AgentTeams shared renderer → Mermaid 11.17.2</h1><p id="status">Running…</p><main id="cases"></main>
<script type="module">
import mermaid from '/node_modules/mermaid/dist/mermaid.esm.min.mjs';
mermaid.initialize({startOnLoad:false,securityLevel:'strict',suppressErrorRendering:true});
const caseFile=new URLSearchParams(location.search).get('cases')||'cases.json';
const cases=await(await fetch('/'+caseFile)).json(), results=[];
for(const [i,c] of cases.entries()) {
 const s=document.createElement('section'); const h=document.createElement('h2');h.textContent=c.name;s.append(h);document.querySelector('main').append(s);
 const row={name:c.name,expected_nodes:c.snapshot.nodes?.length||0,expected_edges:c.snapshot.edges?.length||0,mermaid:c.mermaid};
 try {row.parse=await mermaid.parse(c.mermaid);const r=await mermaid.render('validation'+i,c.mermaid);s.insertAdjacentHTML('beforeend',r.svg);row.nodes=s.querySelectorAll('svg .node').length;row.edges=s.querySelectorAll('svg .flowchart-link').length;row.passed=row.nodes===row.expected_nodes&&row.edges===row.expected_edges;row.svg=r.svg;}
 catch(e){row.passed=false;row.error=String(e);s.className='fail';const p=document.createElement('pre');p.textContent=row.error;s.append(p);}
 results.push(row);
}
const result={at_utc:new Date().toISOString(),mermaid_version:'11.17.2',user_agent:navigator.userAgent,case_count:results.length,passed:results.filter(x=>x.passed).length,failed:results.filter(x=>!x.passed).length,results};
window.validationResult=result;
const saved=await fetch('/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
document.getElementById('status').textContent=`Done: ${result.passed} passed, ${result.failed} failed. Evidence save ${saved.status}.`;
</script>
